<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 280" width="1000" height="280" role="img" aria-label="dimasbotyara.github.io — баннер визитки">
  <defs>
    <pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#a89984" fill-opacity="0.16"/>
    </pattern>
    <clipPath id="cardClip">
      <rect x="4" y="4" width="992" height="272" rx="16"/>
    </clipPath>
  </defs>

  <g clip-path="url(#cardClip)">
    <!-- Base Gruvbox Dark background + dot grid -->
    <rect x="4" y="4" width="992" height="272" fill="#282828"/>
    <rect x="4" y="4" width="992" height="272" fill="url(#dots)"/>

    <!-- Terminal top bar -->
    <rect x="4" y="4" width="992" height="40" fill="#1d2021"/>
    <line x1="4" y1="44" x2="996" y2="44" stroke="#504945" stroke-width="2"/>
    <circle cx="30" cy="24" r="6" fill="#fb4934"/>
    <circle cx="50" cy="24" r="6" fill="#fabd2f"/>
    <circle cx="70" cy="24" r="6" fill="#b8bb26"/>
    <text x="500" y="29" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#a89984">fish 4.9.3 — dimasbotyara@archlinux</text>
    <text x="970" y="29" text-anchor="end" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="700" fill="#fabd2f">RU</text>

    <!-- Left mascot badge: Pixel Frog -->
    <g transform="translate(46, 86)">
      <rect x="4" y="4" width="112" height="112" rx="12" fill="#141617"/>
      <rect x="0" y="0" width="112" height="112" rx="12" fill="#32302f" stroke="#504945" stroke-width="2"/>
      <g transform="translate(16, 16) scale(5)" shape-rendering="crispEdges">
        <rect x="2" y="2" width="4" height="4" fill="#b8bb26"/>
        <rect x="10" y="2" width="4" height="4" fill="#b8bb26"/>
        <rect x="3" y="3" width="2" height="2" fill="#fbf1c7"/>
        <rect x="11" y="3" width="2" height="2" fill="#fbf1c7"/>
        <rect x="4" y="3" width="1" height="1" fill="#1d2021"/>
        <rect x="12" y="3" width="1" height="1" fill="#1d2021"/>
        <rect x="1" y="5" width="14" height="7" fill="#b8bb26"/>
        <rect x="2" y="12" width="12" height="2" fill="#98971a"/>
        <rect x="2" y="8" width="2" height="1" fill="#fb4934"/>
        <rect x="12" y="8" width="2" height="1" fill="#fb4934"/>
        <rect x="5" y="9" width="6" height="1" fill="#1d2021"/>
        <rect x="4" y="8" width="1" height="1" fill="#1d2021"/>
        <rect x="11" y="8" width="1" height="1" fill="#1d2021"/>
      </g>
    </g>

    <!-- Right mascot badge: Exact Pixel Tide Crab (wildlife.py) -->
    <g transform="translate(842, 86)">
      <rect x="4" y="4" width="112" height="112" rx="12" fill="#141617"/>
      <rect x="0" y="0" width="112" height="112" rx="12" fill="#1d2021" stroke="#504945" stroke-width="2"/>
      <!-- Water & sand strips inside crab tile -->
      <rect x="2" y="2" width="108" height="74" rx="10" fill="#83a598" fill-opacity="0.12"/>
      <rect x="2" y="76" width="108" height="34" rx="8" fill="#d5c4a1" fill-opacity="0.14"/>
      <line x1="2" y1="76" x2="110" y2="76" stroke="#83a598" stroke-opacity="0.4" stroke-width="2" stroke-dasharray="6 4"/>
      <ellipse cx="56" cy="86" rx="28" ry="5" fill="#000000" fill-opacity="0.32"/>
      <!-- 9x7 Tide Crab pixels @ 8x scale -->
      <g transform="translate(20, 26) scale(8)" shape-rendering="crispEdges">
        <!-- Row 0: 1.2...2.1 -->
        <rect x="0" y="0" width="1" height="1" fill="#df9874"/>
        <rect x="2" y="0" width="1" height="1" fill="#ffc09c"/>
        <rect x="6" y="0" width="1" height="1" fill="#ffc09c"/>
        <rect x="8" y="0" width="1" height="1" fill="#df9874"/>
        <!-- Row 1: 222...222 -->
        <rect x="0" y="1" width="3" height="1" fill="#ffc09c"/>
        <rect x="6" y="1" width="3" height="1" fill="#ffc09c"/>
        <!-- Row 2: .1.3.3.1. -->
        <rect x="1" y="2" width="1" height="1" fill="#df9874"/>
        <rect x="3" y="2" width="1" height="1" fill="#ffed79"/>
        <rect x="5" y="2" width="1" height="1" fill="#ffed79"/>
        <rect x="7" y="2" width="1" height="1" fill="#df9874"/>
        <!-- Row 3: ..11111.. -->
        <rect x="2" y="3" width="5" height="1" fill="#df9874"/>
        <!-- Row 4: .1222221. -->
        <rect x="1" y="4" width="1" height="1" fill="#df9874"/>
        <rect x="2" y="4" width="5" height="1" fill="#ffc09c"/>
        <rect x="7" y="4" width="1" height="1" fill="#df9874"/>
        <!-- Row 5: 114111411 -->
        <rect x="0" y="5" width="2" height="1" fill="#df9874"/>
        <rect x="2" y="5" width="1" height="1" fill="#2c2337"/>
        <rect x="3" y="5" width="3" height="1" fill="#df9874"/>
        <rect x="6" y="5" width="1" height="1" fill="#2c2337"/>
        <rect x="7" y="5" width="2" height="1" fill="#df9874"/>
        <!-- Row 6: 11.....11 -->
        <rect x="0" y="6" width="2" height="1" fill="#df9874"/>
        <rect x="7" y="6" width="2" height="1" fill="#df9874"/>
      </g>
    </g>

    <!-- Center text block -->
    <text x="500" y="92" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#b8bb26">❯ open https://dimasbotyara.github.io</text>

    <text x="500" y="142" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="40" font-weight="700" letter-spacing="-1" fill="#fbf1c7">dimasbotyara.github.io</text>

    <text x="500" y="176" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="16" fill="#d5c4a1">личная визитка · gruvbox dark &amp; light · 49 репо · чистый html / css / js</text>

    <!-- Feature pills row -->
    <g font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="700">
      <rect x="192" y="198" width="142" height="30" rx="6" fill="#32302f" stroke="#fabd2f" stroke-width="1.5"/>
      <text x="263" y="217" text-anchor="middle" fill="#fabd2f">gruvbox темы</text>

      <rect x="346" y="198" width="134" height="30" rx="6" fill="#32302f" stroke="#8ec07c" stroke-width="1.5"/>
      <text x="413" y="217" text-anchor="middle" fill="#8ec07c">ru / en язык</text>

      <rect x="492" y="198" width="150" height="30" rx="6" fill="#32302f" stroke="#83a598" stroke-width="1.5"/>
      <text x="567" y="217" text-anchor="middle" fill="#83a598">fish терминал</text>

      <rect x="654" y="198" width="144" height="30" rx="6" fill="#32302f" stroke="#df9874" stroke-width="1.5"/>
      <text x="726" y="217" text-anchor="middle" fill="#df9874">приливной краб</text>
    </g>

    <!-- Bottom 7-color Gruvbox status strip -->
    <rect x="4" y="268" width="142" height="8" fill="#fb4934"/>
    <rect x="146" y="268" width="142" height="8" fill="#fe8019"/>
    <rect x="288" y="268" width="142" height="8" fill="#fabd2f"/>
    <rect x="430" y="268" width="142" height="8" fill="#b8bb26"/>
    <rect x="572" y="268" width="142" height="8" fill="#8ec07c"/>
    <rect x="714" y="268" width="142" height="8" fill="#83a598"/>
    <rect x="856" y="268" width="140" height="8" fill="#d3869b"/>
  </g>

  <!-- Crisp outer border -->
  <rect x="4" y="4" width="992" height="272" rx="16" fill="none" stroke="#504945" stroke-width="2.5"/>
</svg>
