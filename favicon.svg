<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" shape-rendering="crispEdges">
  <!-- Gruvbox dark rounded bg -->
  <rect width="16" height="16" rx="3" fill="#282828"/>
  <!-- Frog eyes bumps -->
  <rect x="2" y="2" width="4" height="4" fill="#b8bb26"/>
  <rect x="10" y="2" width="4" height="4" fill="#b8bb26"/>
  <!-- Eye whites & pupils -->
  <rect x="3" y="3" width="2" height="2" fill="#fbf1c7"/>
  <rect x="11" y="3" width="2" height="2" fill="#fbf1c7"/>
  <rect x="4" y="3" width="1" height="1" fill="#1d2021"/>
  <rect x="12" y="3" width="1" height="1" fill="#1d2021"/>
  <!-- Frog head -->
  <rect x="1" y="5" width="14" height="7" fill="#b8bb26"/>
  <rect x="2" y="12" width="12" height="2" fill="#98971a"/>
  <!-- Cheeks -->
  <rect x="2" y="8" width="2" height="1" fill="#fb4934"/>
  <rect x="12" y="8" width="2" height="1" fill="#fb4934"/>
  <!-- Smile -->
  <rect x="5" y="9" width="6" height="1" fill="#1d2021"/>
  <rect x="4" y="8" width="1" height="1" fill="#1d2021"/>
  <rect x="11" y="8" width="1" height="1" fill="#1d2021"/>
</svg>
